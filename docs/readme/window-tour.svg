<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="700" rx="16" fill="#f8f9fc"/>
  <text x="40" y="36" font-size="22" font-weight="700" fill="#1b1f2a">The Ziggy Bot window</text>

  <!-- window -->
  <rect x="20" y="50" width="920" height="480" rx="12" fill="#1e2230"/>
  <path d="M32 50 H928 A12 12 0 0 1 940 62 V80 H20 V62 A12 12 0 0 1 32 50 Z" fill="#151824"/>
  <text x="40" y="70" font-size="12" fill="#c9cee0">Ziggy Bot</text>

  <!-- sidebar -->
  <path d="M20 80 H210 V530 H32 A12 12 0 0 1 20 518 Z" fill="#181b27"/>
  <g font-size="13" fill="#c9cee0">
    <text x="36" y="108" font-size="11" fill="#8a90a6" letter-spacing="1">BOTS   +</text>
    <circle cx="40" cy="128" r="4" fill="#3fbf7f"/><text x="52" y="132">Ziggy</text>
    <circle cx="40" cy="150" r="4" fill="#f5b942"/><text x="52" y="154">Researcher</text>
    <circle cx="40" cy="172" r="4" fill="#3fbf7f"/><text x="52" y="176">Writer</text>
    <text x="36" y="210" font-size="11" fill="#8a90a6" letter-spacing="1">THREADS   +</text>
    <text x="52" y="234">Weekend Plans</text>
    <text x="36" y="274">Search</text>
    <text x="36" y="296">Memory</text>
    <text x="36" y="318">Files</text>
    <text x="36" y="340">Routines</text>
    <text x="36" y="362">Approvals</text>
    <circle cx="112" cy="358" r="8" fill="#e0a02e"/><text x="112" y="362" font-size="11" fill="#1b1f2a" text-anchor="middle">1</text>
    <text x="36" y="384">Computer</text>
    <text x="36" y="406">System Health</text>
    <text x="36" y="428">Settings</text>
  </g>

  <!-- conversation header -->
  <rect x="210" y="80" width="470" height="44" fill="#1b1f2c"/>
  <rect x="226" y="90" width="26" height="22" rx="6" fill="#7a4fd5"/>
  <circle cx="234" cy="100" r="3" fill="#fff"/><circle cx="244" cy="100" r="3" fill="#fff"/>
  <text x="262" y="101" font-size="14" font-weight="700" fill="#e6e9f2">Researcher</text>
  <text x="262" y="116" font-size="10.5" fill="#8a90a6">Finds things out on the web</text>
  <rect x="616" y="91" width="48" height="22" rx="6" fill="#2f3548"/><text x="640" y="106" font-size="12" fill="#c9cee0" text-anchor="middle">Edit</text>

  <!-- messages: the real exchange from the screenshots -->
  <rect x="360" y="132" width="300" height="50" rx="10" fill="#3b4bb0"/>
  <text x="372" y="152" font-size="12.5" fill="#fff">Open en.wikipedia.org/wiki/Great_Barrier_Reef</text>
  <text x="372" y="170" font-size="12.5" fill="#fff">and tell me in two short lines what it is.</text>
  <rect x="230" y="194" width="300" height="134" rx="10" fill="#262b3b"/>
  <rect x="242" y="204" width="276" height="34" rx="6" fill="#2f3548"/>
  <text x="254" y="226" font-size="12" fill="#aeb4c8">▸ 1 step  ✓ opened the Wikipedia page</text>
  <text x="246" y="260" font-size="12.5" fill="#e6e9f2">The Great Barrier Reef is the world's</text>
  <text x="246" y="278" font-size="12.5" fill="#e6e9f2">largest coral reef system. It is located</text>
  <text x="246" y="296" font-size="12.5" fill="#e6e9f2">in the Coral Sea off the coast of</text>
  <text x="246" y="314" font-size="12.5" fill="#e6e9f2">Queensland, Australia.</text>
  <rect x="230" y="338" width="230" height="24" rx="12" fill="#22352c" stroke="#3d8a62"/>
  <text x="244" y="354" font-size="11" fill="#9fd9b8">Memory updated for Researcher · Undo</text>

  <rect x="230" y="372" width="330" height="72" rx="8" fill="#2d2a22" stroke="#b58a2e"/>
  <text x="244" y="394" font-size="12" fill="#f0d9a8">Delete the file notes\old-draft.txt from the workspace</text>
  <rect x="244" y="408" width="70" height="24" rx="6" fill="#4f6fd8"/><text x="279" y="424" font-size="12" fill="#fff" text-anchor="middle">Approve</text>
  <rect x="322" y="408" width="56" height="24" rx="6" fill="#444a5e"/><text x="350" y="424" font-size="12" fill="#fff" text-anchor="middle">Deny</text>
  <rect x="386" y="408" width="50" height="24" rx="6" fill="#444a5e"/><text x="411" y="424" font-size="12" fill="#fff" text-anchor="middle">Edit</text>

  <!-- composer -->
  <rect x="230" y="470" width="430" height="44" rx="10" fill="#262b3b" stroke="#3a4057"/>
  <text x="246" y="497" font-size="13" fill="#7d849b">Message Researcher…  (@ to mention, drop files)</text>
  <circle cx="638" cy="492" r="14" fill="#4f5bd5"/><path d="M632 492 L644 492 M639 487 L644 492 L639 497" stroke="#fff" stroke-width="2" fill="none"/>

  <!-- right panel -->
  <path d="M680 80 H940 V518 A12 12 0 0 1 928 530 H680 Z" fill="#181b27"/>
  <text x="696" y="106" font-size="14" font-weight="700" fill="#e6e9f2">Computer</text>
  <rect x="696" y="120" width="228" height="140" rx="6" fill="#f3f4f8" stroke="#3a4057"/>
  <rect x="696" y="120" width="228" height="18" rx="6" fill="#dfe2ea"/>
  <text x="708" y="156" font-size="10" fill="#555">WIKIPEDIA</text>
  <text x="708" y="172" font-size="11.5" font-weight="700" fill="#222">Great Barrier Reef</text>
  <rect x="708" y="180" width="130" height="7" fill="#dfe2ea"/><rect x="708" y="192" width="130" height="7" fill="#eceef3"/>
  <rect x="708" y="204" width="130" height="7" fill="#dfe2ea"/><rect x="708" y="216" width="130" height="7" fill="#eceef3"/>
  <rect x="708" y="228" width="100" height="7" fill="#dfe2ea"/>
  <rect x="850" y="172" width="62" height="56" rx="3" fill="#5aa7c8"/><path d="M850 214 Q872 196 894 208 T912 204 V228 H850 Z" fill="#2f7d9c"/>
  <text x="696" y="286" font-size="12" fill="#c9cee0">Researcher · Great Barrier Reef</text>
  <rect x="696" y="304" width="110" height="28" rx="6" fill="#2f3548"/><text x="751" y="323" font-size="12" fill="#fff" text-anchor="middle">Take control</text>
  <text x="696" y="366" font-size="12" font-weight="700" fill="#e6e9f2">Activity</text>
  <text x="696" y="388" font-size="11" fill="#8a90a6">Researcher opened Great Barrier Reef</text>
  <text x="696" y="408" font-size="11" fill="#8a90a6">Researcher read the page</text>

  <!-- callouts -->
  <g font-size="13" font-weight="700" fill="#1b1f2a" text-anchor="middle">
    <circle cx="190" cy="140" r="12" fill="#f5b942"/><text x="190" y="145">1</text>
    <circle cx="342" cy="157" r="12" fill="#f5b942"/><text x="342" y="162">2</text>
    <circle cx="546" cy="221" r="12" fill="#f5b942"/><text x="546" y="226">3</text>
    <circle cx="476" cy="350" r="12" fill="#f5b942"/><text x="476" y="355">4</text>
    <circle cx="576" cy="408" r="12" fill="#f5b942"/><text x="576" y="413">5</text>
    <circle cx="672" cy="456" r="12" fill="#f5b942"/><text x="672" y="461">6</text>
    <circle cx="918" cy="102" r="12" fill="#f5b942"/><text x="918" y="107">7</text>
  </g>

  <!-- legend -->
  <g font-size="13.5" fill="#1b1f2a">
    <g text-anchor="middle" font-weight="700">
      <circle cx="50" cy="576" r="11" fill="#f5b942"/><text x="50" y="581">1</text>
      <circle cx="50" cy="608" r="11" fill="#f5b942"/><text x="50" y="613">2</text>
      <circle cx="50" cy="640" r="11" fill="#f5b942"/><text x="50" y="645">3</text>
      <circle cx="50" cy="672" r="11" fill="#f5b942"/><text x="50" y="677">4</text>
      <circle cx="510" cy="576" r="11" fill="#f5b942"/><text x="510" y="581">5</text>
      <circle cx="510" cy="608" r="11" fill="#f5b942"/><text x="510" y="613">6</text>
      <circle cx="510" cy="640" r="11" fill="#f5b942"/><text x="510" y="645">7</text>
    </g>
    <text x="70" y="581"><tspan font-weight="700">Sidebar:</tspan> your bots, team threads and every page</text>
    <text x="70" y="613"><tspan font-weight="700">Conversation:</tspan> you on the right, the bot on the left</text>
    <text x="70" y="645"><tspan font-weight="700">Task card:</tspan> open it to see each step the bot took</text>
    <text x="70" y="677"><tspan font-weight="700">Memory chip:</tspan> what the bot just learnt, with Undo</text>
    <text x="530" y="581"><tspan font-weight="700">Approval card:</tspan> nothing risky until you approve</text>
    <text x="530" y="613"><tspan font-weight="700">Message box:</tspan> type, @mention a bot, drop in files</text>
    <text x="530" y="645"><tspan font-weight="700">Computer panel:</tspan> watch the bots' browser live</text>
    <text x="530" y="665" font-size="12.5" fill="#5b6275">and press Take control to use it yourself</text>
  </g>
</svg>
