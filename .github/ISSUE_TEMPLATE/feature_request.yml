name: Suggest an idea
description: Something you'd love Ziggy Bot to do.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Ideas are very welcome. Tell us what you'd like to do and why it matters to you.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Ziggy Bot to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: The job you're trying to get done, and how you do it today.
